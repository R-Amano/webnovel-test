<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鉄アドGO!">
  <link rel="apple-touch-icon" href="assets/img/icon.png">
  <title>鉄アドGO! - ウェブアーカイヴ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
</head>

<body>
  <div class="hero">
    <img src="assets/img/title.png" alt="Title Logo" class="main-logo">

    <div class="menu-container">
      <nav class="scenario-select">
        <ul class="episode-list" id="story-list">
          <!-- meta.jsonから動的に生成されます -->
        </ul>
      </nav>
      <footer>
        <p>&copy; 2026 Ryosuke Amano. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <script>
    // 右クリックメニュー（長押しメニュー）を無効化
    document.addEventListener('contextmenu', e => e.preventDefault());
    // 画像などのドラッグを無効化
    document.addEventListener('dragstart', e => e.preventDefault());

    // meta.jsonを読み込んでストーリーリストを生成
    fetch('storys/meta.json')
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById('story-list');
        list.innerHTML = ''; // 既存の静的なリストをクリア
        data.ra_story_metadatas.forEach(item => {
          const li = document.createElement('li');
          // "第１話 - はじまりの場所" を分割して表示
          const parts = item.title.split(' - ');
          const epNum = parts[0] || '';
          const epTitle = parts[1] || '';

          li.innerHTML = `
                        <div class="episode-link" onclick="location.href='storys/index.html?scene=${item.id}/01'">
                            <span class="ep-number">${epNum}</span>
                            <span class="ep-title">${epTitle}</span>
                        </div>
                    `;
          list.appendChild(li);
        });
      })
      .catch(err => console.error('meta.jsonの読み込みに失敗しました:', err));

    // Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed', err));
      });
    }
  </script>
</body>

</html>
