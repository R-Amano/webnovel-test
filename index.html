<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鉄アドGO!">
  <link rel="apple-touch-icon" href="assets/img/icon.png">
  <title>鉄アドGO! - ウェブアーカイヴ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
</head>

<body>
  <div class="stone-counter" onclick="openStoneDialog()">
    <img src="assets/img/panel/stone_1.png" alt="Stone">
    <span id="stone-count">0</span>
  </div>

  <div class="stone-counter" style="left: 115px; cursor: pointer; justify-content: center;" onclick="forceUpdate()">
    <span>更新</span>
  </div>

  <!-- 石の説明ダイアログ -->
  <div id="stone-dialog" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="stone-dialog-header">
        <img src="assets/img/panel/stone_1.png" alt="Stone" class="dialog-stone-icon">
        <div class="stone-dialog-text">
          <h3>記憶の宝跡</h3>
          <p class="stone-description">
            人々の想いが刻まれた宝石。<br>ストーリー読了などで獲得。
          </p>
        </div>
      </div>
      <button class="btn-reset" onclick="openConfirmDialog()">データをリセットする</button>
      <button class="btn-close-modal" onclick="closeStoneDialog()">閉じる</button>
    </div>
  </div>

  <!-- リセット確認ダイアログ -->
  <div id="confirm-dialog" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>データのリセット</h3>
      <p class="stone-description">
        全ての進行状況（記憶の宝跡、既読）を削除します。よろしいですか？<br>※この操作は取り消せません。
      </p>
      <button class="btn-reset" onclick="executeReset()">削除</button>
      <button class="btn-close-modal" onclick="closeConfirmDialog()">キャンセル</button>
    </div>
  </div>

  <div class="hero">
    <img src="assets/img/title.png" alt="Title Logo" class="main-logo">

    <div class="menu-container">
      <nav class="scenario-select">
        <ul class="episode-list" id="story-list">
          <!-- meta.jsonから動的に生成されます -->
        </ul>
      </nav>
      <footer>
        <p style="opacity: 0.5; font-size: 0.7rem;">&copy; 2026 Ryosuke Amano. All rights reserved.</p>
        <p id="app-version" style="opacity: 0.5; font-size: 0.7rem; margin-top: 5px;"></p>
      </footer>
    </div>
  </div>

  <script>
    // 右クリックメニュー（長押しメニュー）を無効化
    document.addEventListener('contextmenu', e => e.preventDefault());
    // 画像などのドラッグを無効化
    document.addEventListener('dragstart', e => e.preventDefault());

    // ローカルストレージから石の数と既読情報を取得（初期値の設定）
    const totalStones = localStorage.getItem('ra_stone_count') || '0';
    document.getElementById('stone-count').textContent = totalStones;

    // 既読済みIDのリストを取得 (例: ["scene1", "scene2"])
    const readStoriesJson = localStorage.getItem('ra_read_stories');
    const readStories = readStoriesJson ? JSON.parse(readStoriesJson) : [];

    // meta.jsonを読み込んでストーリーリストを生成
    fetch('storys/meta.json')
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById('story-list');
        list.innerHTML = ''; // 既存の静的なリストをクリア
        data.ra_story_metadatas.forEach(item => {
          const li = document.createElement('li');
          // "第１話 - はじまりの場所" を分割して表示
          const parts = item.title.split(' - ');
          const epNum = parts[0] || '';
          const epTitle = parts[1] || '';

          // 既読かどうかを判定
          const isRead = readStories.includes(item.id);

          li.innerHTML = `
                        <div class="episode-link" onclick="location.href='storys/index.html?scene=${item.id}/01'">
                            <span class="ep-number">${epNum}</span>
                            <span class="ep-title">${epTitle}</span>
                            ${isRead ? '' : '<img src="assets/img/panel/stone_1.png" class="read-icon">'}
                        </div>
                    `;
          list.appendChild(li);
        });
      })
      .catch(err => console.error('meta.jsonの読み込みに失敗しました:', err));

    // Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            console.log('Service Worker registered');

            // Service Workerが準備できたらバージョンを要求する
            const requestVersion = () => {
              if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
              }
            };

            navigator.serviceWorker.addEventListener('controllerchange', requestVersion);
            requestVersion();
          })
          .catch(err => console.log('Service Worker registration failed', err));
      });

      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'VERSION_INFO') {
          document.getElementById('app-version').textContent = `${event.data.version}`;
        }
      });
    }

    // 石ダイアログの制御
    function openStoneDialog() {
      document.getElementById('stone-dialog').classList.remove('hidden');
    }

    function closeStoneDialog() {
      document.getElementById('stone-dialog').classList.add('hidden');
    }

    // リセット確認ダイアログの制御
    function openConfirmDialog() {
      document.getElementById('stone-dialog').classList.add('hidden');
      document.getElementById('confirm-dialog').classList.remove('hidden');
    }

    function closeConfirmDialog() {
      document.getElementById('confirm-dialog').classList.add('hidden');
    }

    // リセットの実行
    function executeReset() {
      localStorage.removeItem('ra_stone_count');
      localStorage.removeItem('ra_read_stories');
      location.reload();
    }

    // キャッシュをクリアして強制的に最新データを再取得する
    async function forceUpdate() {
      try {
        // キャッシュストレージを全て削除
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        // 登録されているService Workerを解除
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) await registration.unregister();
        }
        // ページをリロード（サーバーから最新を読み込む）
        window.location.reload();
      } catch (e) {
        console.error('Update failed:', e);
        window.location.reload();
      }
    }
  </script>
</body>

</html>
