<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鉄アドGO!">
  <link rel="apple-touch-icon" href="assets/img/icon.png">
  <title>鉄アドGO! - ウェブアーカイヴ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
</head>

<body>
  <div class="top-controls">
    <div class="stone-counter" onclick="openStoneDialog()">
      <img src="assets/img/panel/stone_1.png" alt="Stone">
      <span id="stone-count">0</span>
    </div>

    <div class="stone-counter" onclick="forceUpdate()">
      <span>更新</span>
    </div>

    <div class="stone-counter" onclick="shareUrl()">
      <span>共有</span>
    </div>
  </div>

  <!-- 石の説明ダイアログ -->
  <div id="stone-dialog" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="stone-dialog-header">
        <img src="assets/img/panel/stone_1.png" alt="Stone" class="dialog-stone-icon">
        <div class="stone-dialog-text">
          <h3>記憶の宝跡</h3>
          <p class="stone-description">
            人々の想いが刻まれた宝石。<br>ストーリー読了などで獲得。
          </p>
        </div>
      </div>
      <button class="btn-reset" onclick="openConfirmDialog()">データをリセットする</button>
      <button class="btn-close-modal" onclick="closeStoneDialog()">閉じる</button>
    </div>
  </div>

  <!-- リセット確認ダイアログ -->
  <div id="confirm-dialog" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>データのリセット</h3>
      <p class="stone-description">
        全ての進行状況（記憶の宝跡、既読）を削除します。よろしいですか？<br>※この操作は取り消せません。
      </p>
      <button class="btn-reset" onclick="executeReset()">削除</button>
      <button class="btn-close-modal" onclick="closeConfirmDialog()">キャンセル</button>
    </div>
  </div>

  <div class="hero">
    <img src="assets/img/title.png" alt="Title Logo" class="main-logo">

    <div class="menu-container">
      <nav class="scenario-select">
        <ul class="episode-list" id="story-list">
          <!-- meta.jsonから動的に生成されます -->
        </ul>
      </nav>
      <footer>
        <p>&copy; 2026 Ryosuke Amano. All rights reserved.</p>
        <p id="app-version"></p>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
